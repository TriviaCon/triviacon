<!doctype html>
<!--
  Source for docs/social-preview.png (1280×640, GitHub's social preview size).
  Re-render after editing:
    google-chrome --headless=new --hide-scrollbars --window-size=1280,640 \
      --screenshot=docs/social-preview.png site/social-preview.html
  Only screenshots without third-party artwork belong here.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=block" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0f16; --card: #171b27; --line: #262b3b; --text: #eceef5;
    --muted: #9095ad; --accent: #7b93ff; --accent-2: #f2a65a; --ok: #5fd39a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif; color: var(--text); position: relative;
    background:
      radial-gradient(700px 420px at 92% 8%, rgb(123 147 255 / .28), transparent 70%),
      radial-gradient(560px 380px at 70% 110%, rgb(242 166 90 / .20), transparent 70%),
      var(--bg);
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px; opacity: .35;
    mask-image: radial-gradient(900px 500px at 75% 50%, #000, transparent 75%);
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
  .brand img { width: 104px; height: 104px; filter: drop-shadow(0 12px 28px rgb(0 0 0 / .5)); }
  .brand span { font-size: 54px; font-weight: 800; letter-spacing: -.03em; }
  h1 { font-size: 62px; line-height: 1.04; font-weight: 800; letter-spacing: -.035em; }
  h1 em {
    font-style: normal; display: block;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
  .chips span {
    font-size: 19px; font-weight: 700; color: var(--muted);
    border: 1px solid var(--line); background: rgb(23 27 39 / .8);
    padding: 7px 16px; border-radius: 999px;
  }
  .chips span:first-child { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, var(--line)); }

  .screen {
    position: absolute; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); background: var(--card);
    box-shadow: 0 30px 70px -20px rgb(0 0 0 / .75);
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .bar { height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #11141d; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--muted); }
  .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .bar b { margin-left: 6px; font-weight: 700; }
  .panel { left: 640px; top: 70px; width: 600px; height: 362px; }
  .panel .shot { height: calc(100% - 26px); }
  .panel img { object-position: 0 0; }
  .game { left: 812px; top: 290px; width: 420px; height: 262px; transform: rotate(-2deg); border-color: #3a4160; }
  .game .shot { height: calc(100% - 26px); }
  .label { position: absolute; font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 8px; }
  .l-panel { left: 664px; top: 448px; color: var(--accent); background: rgb(123 147 255 / .14); }
  .l-game { left: 1000px; top: 568px; color: var(--accent-2); background: rgb(242 166 90 / .14); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../docs/icon.png" alt="" /><span>Triviacon</span></div>
    <h1>Run the quiz night.<em>Not the tech.</em></h1>
    <div class="chips"><span>Free &amp; open source</span><span>Portable</span><span>Offline</span><span>Windows · macOS · Linux</span></div>
  </div>

  <div class="screen panel">
    <div class="bar"><i></i><i></i><i></i><b>Control panel</b></div>
    <div class="shot"><img src="../docs/screenshots/panel-list.png" alt="" style="width:1920px;height:auto;max-width:none;transform:scale(.4478);transform-origin:0 0" /></div>
  </div>
  <div class="screen game">
    <div class="bar"><i></i><i></i><i></i><b>Game screen</b></div>
    <div class="shot"><img src="../docs/screenshots/game-list.png" alt="" /></div>
  </div>
  <span class="label l-panel">You drive</span>
  <span class="label l-game">The room watches</span>
</body>
</html>
