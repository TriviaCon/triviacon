name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Great — describe it below. Feel free to write in any language.

        **Before you start:** TriviaCON has a deliberately narrow, fixed scope. Please skim the design principles and permanent non-goals in [CONTRIBUTING.md](https://github.com/TriviaCon/triviacon/blob/main/CONTRIBUTING.md) first — a few things (networking, automatic scoring, automated game flow, AI-authored content, cloud/accounts/telemetry) are permanently out of scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem does this feature solve? What are you missing?
      placeholder: When I do X, I'd like to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this feature should work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you considered other approaches?

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Context, examples, mockups — anything that helps.
