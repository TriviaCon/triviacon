name: Bug report
description: Report a problem with the app
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Fill this in as thoroughly as you can — it helps us find and fix the problem faster. Feel free to write in any language.

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.9.1
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect instead?
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a quiz file
        2. Click...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (app crashes)
        - High (a feature is broken)
        - Medium (something misbehaves)
        - Low (cosmetic)
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, quiz files (if the problem is tied to a specific quiz).
